<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">

    < title> Module E 20027 Vocabulary Flashcards - Part 1</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        .counter {
            font-size: 0.95rem;
            color: var(--text-muted);
            background: #e0e7ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 480px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 380px;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: var(--shadow);
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            user-select: none;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #ffffff;
            overflow-y: auto;
        }

        /* Front Face Layout */
        .card-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pos-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            background: #f1f5f9;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .tts-btn {
            background: #eef2ff;
            border: none;
            color: var(--primary);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .tts-btn:hover {
            background: #e0e7ff;
        }

        .tts-btn:active {
            transform: scale(0.95);
        }

        .word-main-container {
            text-align: center;
            margin: auto 0;
        }

        .word-en {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .word-grammar {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .flip-hint {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        /* Back Face Layout */
        .translations-section {
            margin-bottom: 15px;
        }

        .trans-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 1.1rem;
        }

        .lang-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .trans-he {
            font-weight: 700;
            direction: rtl;
            color: var(--primary);
        }

        .trans-fr {
            font-weight: 700;
            color: #0d9488;
        }

        .synonyms-box {
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: none; /* Hidden by default if empty */
        }

        .example-box {
            background: #fdf2f8;
            border-left: 4px solid #db2777;
            padding: 10px 14px;
            border-radius: 0 10px 10px 0;
            font-size: 0.9rem;
        }

        .example-en {
            font-weight: 600;
            margin-bottom: 4px;
            color: #831843;
        }

        .example-trans {
            font-size: 0.85rem;
            color: #9d174d;
        }

        .example-trans.he {
            direction: rtl;
        }

        /* Navigation Controls */
        .nav-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
        }

        .nav-btn {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .nav-btn:active {
            transform: scale(0.97);
        }

        .nav-btn svg {
            width: 18px;
            height: 18px;
        }
        
        .jump-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .jump-container a {
            text-decoration: none;
            font-size: 0.85rem;
            padding: 8px 16px;
        }
    </style>

<body>

    <header>
        <div class="title">Flashcards - Part 3</div>
        <div class="counter" id="counter">1 / 1</div>
    </header>

    <div class="container" id="cardContainer">
        <div class="card" id="flashcard" onclick="toggleCard()">
            <!-- Front Face -->
            <div class="card-face">
                <div class="card-header-top">
                    <span class="pos-badge" id="posBadge">NOUN</span>
                    <button class="tts-btn" id="ttsBtn" onclick="playAudio(event)" title="Listen">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </button>
                </div>
                <div class="word-main-container">
                    <div class="word-en" id="wordEn">Loading...</div>
                    <div class="word-grammar" id="wordGrammar"></div>
                </div>
                <div class="flip-hint">Tap card to flip ↺</div>
            </div>

            <!-- Back Face -->
            <div class="card-face card-back">
                <div class="translations-section">
                    <div class="trans-row">
                        <span class="lang-label">Hebrew</span>
                        <span class="trans-he" id="transHe">-</span>
                    </div>
                </div>
                <div class="synonyms-box" id="synonymsBox">
                    <strong>Synonyms:</strong> <span id="wordSynonyms">-</span>
                </div>
                <div class="example-box">
                    <div class="example-en" id="exEn">-</div>
                    <div class="example-trans he" id="exHe">-</div>
                </div>
                <div class="flip-hint" style="margin-top: 10px;">Tap to flip back</div>
            </div>
        </div>
    </div>

    <div class="nav-container">
        <button class="nav-btn" onclick="prevCard()">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Previous
        </button>
        <button class="nav-btn" onclick="nextCard()">
            Next
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>

    <div class="jump-container" style="margin-top: 15px; display: flex; gap: 10px;">
        <a href="A2.html" class="nav-btn" style="text-decoration: none; font-size: 0.85rem; padding: 8px 16px;">Go to Previous Part</a>
    </div>

    <script>
        let currentIndex = 0;
        let hasUserInteracted = false;

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateCard() {
            if (typeof words === 'undefined' || words.length === 0) return;
            const item = words[currentIndex];
            
            document.getElementById('flashcard').classList.remove('is-flipped');

            document.getElementById('posBadge').innerText = item.pos || '';
            document.getElementById('wordEn').innerText = item.en || '';
            document.getElementById('wordGrammar').innerText = item.grammar || '';
            document.getElementById('transHe').innerText = item.mean_he || '';
            
            // Hide synonyms box if empty
            if (item.synonyms && item.synonyms.length > 0) {
                document.getElementById('synonymsBox').style.display = 'block';
                document.getElementById('wordSynonyms').innerText = item.synonyms.join(', ');
            } else {
                document.getElementById('synonymsBox').style.display = 'none';
            }

            document.getElementById('exEn').innerText = item.ex_en || '';
            document.getElementById('exHe').innerText = item.ex_he || '';

            document.getElementById('counter').innerText = `${currentIndex + 1} / ${words.length}`;
            
            if (hasUserInteracted) {
                speakText(item.en);
            }
        }

        function toggleCard() {
            hasUserInteracted = true;
            const card = document.getElementById('flashcard');
            card.classList.toggle('is-flipped');
            
            if (card.classList.contains('is-flipped')) {
                speakText(words[currentIndex].ex_en);
            }
        }

        function nextCard() {
            hasUserInteracted = true;
            if (typeof words === 'undefined') return;
            currentIndex = (currentIndex + 1) % words.length;
            updateCard();
        }

        function prevCard() {
            hasUserInteracted = true;
            if (typeof words === 'undefined') return;
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            updateCard();
        }

        function playAudio(event) {
            hasUserInteracted = true;
            if (event) event.stopPropagation();
            if (typeof words === 'undefined') return;
            speakText(words[currentIndex].en);
        }

        let touchStartX = 0;
        let touchEndX = 0;
        const cardElement = document.getElementById('flashcard');

        cardElement.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        cardElement.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) {
                nextCard();
            }
            if (touchEndX > touchStartX + threshold) {
                prevCard();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ' || e.key === 'Enter') toggleCard();
        });

        document.body.addEventListener('click', () => {
            if (!hasUserInteracted) {
                hasUserInteracted = true;
                speakText(words[currentIndex].en);
            }
        }, { once: true });

        window.onload = function() {
            updateCard();
        };
    </script>
</body>
