    <rect x="42" y="20" width="428" height="420" rx="108" fill="url(#tile)"/>
    <rect x="55" y="33" width="402" height="394" rx="96" fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="0.23"/>
    <path d="M88 116C145 55 238 37 333 57c51 11 89 34 112 59-39-30-92-43-156-37-82 7-149 34-201 82z" fill="#ffffff" opacity="0.16"/>
  </g>

  <g>
    <path d="M105 157c54-25 108-20 151 17v202c-43-31-97-35-151-13z" fill="url(#book)" stroke="#ffffff" stroke-width="9" stroke-linejoin="round"/>
    <path d="M407 157c-54-25-108-20-151 17v202c43-31 97-35 151-13z" fill="url(#book)" stroke="#ffffff" stroke-width="9" stroke-linejoin="round"/>
    <path d="M256 174v202" fill="none" stroke="#b6eecb" stroke-width="10" stroke-linecap="round"/>
    <path d="M133 203c33-10 63-8 91 5M133 244c33-10 63-8 91 5M288 208c28-13 58-15 91-5M288 249c28-13 58-15 91-5" fill="none" stroke="#a4e7bf" stroke-width="9" stroke-linecap="round"/>
