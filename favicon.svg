<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Module E Vocabulary</title>
  <desc id="description">A white open book with the letter E on a light-green three-dimensional tile.</desc>
  <defs>
    <linearGradient id="tile" x1="104" y1="70" x2="414" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#78efaa"/>
      <stop offset="0.5" stop-color="#38d57a"/>
      <stop offset="1" stop-color="#20b861"/>
    </linearGradient>
    <linearGradient id="book" x1="256" y1="142" x2="256" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eafff1"/>
    </linearGradient>
    <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="0" dy="20" stdDeviation="17" flood-color="#08783a" flood-opacity="0.34"/>
    </filter>
    <filter id="badgeShadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#096f37" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g filter="url(#tileShadow)">
