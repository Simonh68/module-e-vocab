<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg?v=20260809-1" type="image/svg+xml">
    <link rel="shortcut icon" href="favicon.svg?v=20260809-1" type="image/svg+xml">
    <title>Module E 2027 Vocabulary Flashcards - Part C1</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        .counter {
            font-size: 0.95rem;
            color: var(--text-muted);
            background: #e0e7ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 480px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 380px;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: var(--shadow);
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            user-select: none;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #ffffff;
            overflow-y: auto;
        }

        /* Front Face Layout */
        .card-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pos-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            background: #f1f5f9;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .tts-btn {
            background: #eef2ff;
            border: none;
            color: var(--primary);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .tts-btn:hover {
            background: #e0e7ff;
        }

        .tts-btn:active {
            transform: scale(0.95);
        }

        .word-main-container {
            text-align: center;
            margin: auto 0;
        }

        .word-en {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .word-grammar {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .flip-hint {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        /* Back Face Layout */
        .translations-section {
            margin-bottom: 15px;
        }

        .trans-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 1.1rem;
        }

        .lang-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .trans-he {
            font-weight: 700;
            direction: rtl;
            color: var(--primary);
        }

        .synonyms-box {
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: none;
        }

        .example-box {
            background: #fdf2f8;
            border-left: 4px solid #db2777;
            padding: 10px 14px;
            border-radius: 0 10px 10px 0;
            font-size: 0.9rem;
        }

        .example-en {
            font-weight: 600;
            margin-bottom: 4px;
            color: #831843;
        }

        .example-trans {
            font-size: 0.85rem;
            color: #9d174d;
        }

        .example-trans.he {
            direction: rtl;
        }



        .back-details-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.9fr);
            gap: 12px;
            align-items: stretch;
        }

        .back-details-grid.family-empty {
            grid-template-columns: 1fr;
        }

        .family-box {
            background: #ecfdf5;
            border-left: 4px solid #22c55e;
            padding: 10px 12px;
            border-radius: 0 10px 10px 0;
            font-size: 0.82rem;
            color: #166534;
        }

        .family-title {
            font-weight: 800;
            margin-bottom: 6px;
            color: #15803d;
        }

        .family-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .family-word {
            font-weight: 700;
        }

        .family-pos {
            color: #4b5563;
            font-size: 0.76rem;
        }

        @media (max-width: 520px) {
            .back-details-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Navigation Controls */
        .nav-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
        }

        .nav-btn {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .nav-btn:active {
            transform: scale(0.97);
        }

        .nav-btn svg {
            width: 18px;
            height: 18px;
        }
        
        .jump-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .jump-container a {
            text-decoration: none;
            font-size: 0.85rem;
            padding: 8px 16px;
        }
    </style>

ortant events and following special rules","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"tear","pos":"Verb","grammar":"verb","mean_he":"לקרוע","ex_en":"Do not tear the paper.","ex_he":"אל תקרע את הנייר.","official_entry":"tear","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"pull something until it breaks or has a hole","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"loan","pos":"Noun","grammar":"noun","mean_he":"הלוואה","ex_en":"We received a bank loan.","ex_he":"קיבלנו הלוואה מהבנק.","official_entry":"loan","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"money or a thing that is borrowed","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"equal","pos":"Verb","grammar":"verb","mean_he":"שווה","ex_en":"All men are equal.","ex_he":"כל בני האדם שווים.","official_entry":"equal","family_members":[{"word":"equality","pos":"Noun"}],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"have the same number, price or size","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"or so","pos":"Phrase","grammar":"phrase / chunk","mean_he":"בערך","ex_en":"It takes an hour or so.","ex_he":"זה לוקח שעה בערך.","official_entry":"or so","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 synonym(s)","support_text":"about","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"off","pos":"Adverb","grammar":"adverb","mean_he":"הנחה; כבוי","ex_en":"It is 50% off.","ex_he":"זה ב-50% הנחה.","official_entry":"off","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"Boundary examples","support_text":"not operating; away from a place or position","boundary_examples":"the light is not working; 20 percent less; a day away from work","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"sign","pos":"Noun","grammar":"noun","mean_he":"שלט; סימן","ex_en":"The sign says that parking is forbidden.","ex_he":"השלט אומר שהחניה אסורה.","official_entry":"sign","family_members":[{"word":"signature","pos":"Noun"}],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"a mark or board that gives information","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"deaf","pos":"Adjective","grammar":"adjective","mean_he":"חירש","ex_en":"He uses sign language because he is deaf.","ex_he":"הוא משתמש בשפת סימנים כי הוא חירש.","official_entry":"deaf","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"not able to hear","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"bother","pos":"Verb","grammar":"verb","mean_he":"להטריד; להטריח","ex_en":"Please don’t bother me.","ex_he":"בבקשה אל תטריד אותי.","official_entry":"bother","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"cause trouble or worry; make a small problem","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"idiom","pos":"Noun","grammar":"noun","mean_he":"ניב; ביטוי","ex_en":"’Break a leg’ is a common idiom.","ex_he":"'שבור רגל' זה ביטוי נפוץ.","official_entry":"idiom","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"a group of words with a meaning different from each separate word","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"stay","pos":"Noun","grammar":"noun","mean_he":"שהייה","ex_en":"Enjoy your stay at the hotel.","ex_he":"תהנה מהשהייה שלך במלון.","official_entry":"stay","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"time spent in a place","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"departure","pos":"Noun","grammar":"noun","mean_he":"המראה; עזיבה","ex_en":"What is the departure time?","ex_he":"מהי שעת ההמראה?","official_entry":"departure","family_members":[{"word":"depart","pos":"Verb"}],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"the act of leaving; the time a plane or train leaves","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"name","pos":"Noun","grammar":"noun","mean_he":"מוניטין; שם","ex_en":"He made a name for himself.","ex_he":"הוא עשה לעצמו שם (מוניטין).","official_entry":"name","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"the opinion people have about a person or company","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"generous","pos":"Adjective","grammar":"adjective","mean_he":"נדיב","ex_en":"That was a generous gift.","ex_he":"זו הייתה מתנה נדיבה.","official_entry":"generous","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"happy to give or share a lot","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"log off","pos":"Phrase","grammar":"phrase / chunk","mean_he":"להתנתק (מחשב)","ex_en":"Log off before you leave.","ex_he":"התנתק לפני שאתה עוזב.","official_entry":"log off/out","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"stop using a computer service","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"}];
    </script>
</head>
<body>
    <header>
        <div class="title">Flashcards - Part C1</div>
        <div class="counter" id="counter">1 / 1</div>
    </header>

    <div class="container" id="cardContainer">
        <div class="card" id="flashcard" onclick="toggleCard()">
            <div class="card-face">
                <div class="card-header-top">
                    <span class="pos-badge" id="posBadge">NOUN</span>
                    <button class="tts-btn" id="ttsBtn" onclick="playAudio(event)" title="Listen">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </button>
                </div>
                <div class="word-main-container">
                    <div class="word-en" id="wordEn">Loading...</div>
                    <div class="word-grammar" id="wordGrammar"></div>
                </div>
                <div class="flip-hint">Tap card to flip ↺</div>
            </div>

            <div class="card-face card-back">
                <div class="translations-section">
                    <div class="trans-row">
                        <span class="lang-label">Hebrew</span>
                        <span class="trans-he" id="transHe">-</span>
                    </div>
                </div>
                <div class="synonyms-box" id="synonymsBox">
                    <strong>Synonyms:</strong> <span id="wordSynonyms">-</span>
                </div>
                <div class="back-details-grid" id="backDetailsGrid">
                    <div class="example-box">
                        <div class="example-en" id="exEn">-</div>
                        <div class="example-trans he" id="exHe">-</div>
                    </div>
                    <div class="family-box" id="familyBox">
                        <div class="family-title">Family Members</div>
                        <ul class="family-list" id="familyList"></ul>
                    </div>
                </div>
                <div class="flip-hint" style="margin-top: 10px;">Tap to flip back</div>
            </div>
        </div>
    </div>

    <div class="nav-container">
        <button class="nav-btn" onclick="prevCard()">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Previous
        </button>
        <button class="nav-btn" onclick="nextCard()">
            Next
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>

    <div class="jump-container">
        <a href="C2.html" class="nav-btn">Go to Next Part</a>
    </div>

    <script>
        let currentIndex = 0;
        let hasUserInteracted = false;

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateCard() {
            if (typeof words === 'undefined' || words.length === 0) return;
            const item = words[currentIndex];
            
            document.getElementById('flashcard').classList.remove('is-flipped');

            document.getElementById('posBadge').innerText = (item.pos || '').toUpperCase();
            document.getElementById('wordEn').innerText = item.en || '';
            document.getElementById('wordGrammar').innerText = item.grammar || '';
            document.getElementById('transHe').innerText = item.mean_he || '';
            
            if (item.synonyms && item.synonyms.length > 0) {
                document.getElementById('synonymsBox').style.display = 'block';
                document.getElementById('wordSynonyms').innerText = item.synonyms.join(', ');
            } else {
                document.getElementById('synonymsBox').style.display = 'none';
            }

            document.getElementById('exEn').innerText = item.ex_en || '';
            const exHe = document.getElementById('exHe');
            exHe.innerText = item.ex_he || '';
            exHe.style.display = item.ex_he ? 'block' : 'none';

            const familyBox = document.getElementById('familyBox');
            const familyList = document.getElementById('familyList');
            const backDetailsGrid = document.getElementById('backDetailsGrid');
            familyList.replaceChildren();
            if (item.family_members && item.family_members.length > 0) {
                familyBox.style.display = 'block';
                backDetailsGrid.classList.remove('family-empty');
                item.family_members.forEach(member => {
                    const listItem = document.createElement('li');
                    const word = document.createElement('span');
                    const pos = document.createElement('span');
                    word.className = 'family-word';
                    pos.className = 'family-pos';
                    word.textContent = member.word;
                    pos.textContent = ` — ${String(member.pos || '').toLowerCase()}`;
                    listItem.append(word, pos);
                    familyList.appendChild(listItem);
                });
            } else {
                familyBox.style.display = 'none';
                backDetailsGrid.classList.add('family-empty');
            }
            document.getElementById('counter').innerText = `${currentIndex + 1} / ${words.length}`;
            
            if (hasUserInteracted) {
                speakText(item.en);
            }
        }

        function toggleCard() {
            hasUserInteracted = true;
            const card = document.getElementById('flashcard');
            card.classList.toggle('is-flipped');
            if (card.classList.contains('is-flipped')) {
                speakText(words[currentIndex].ex_en);
            }
        }

        function nextCard() {
            hasUserInteracted = true;
            currentIndex = (currentIndex + 1) % words.length;
            updateCard();
        }

        function prevCard() {
            hasUserInteracted = true;
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            updateCard();
        }

        function playAudio(event) {
            hasUserInteracted = true;
            if (event) event.stopPropagation();
            speakText(words[currentIndex].en);
        }

        let touchStartX = 0;
        let touchEndX = 0;
        const cardElement = document.getElementById('flashcard');

        cardElement.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        cardElement.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) nextCard();
            if (touchEndX > touchStartX + threshold) prevCard();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ' || e.key === 'Enter') toggleCard();
        });

        document.body.addEventListener('click', () => {
            if (!hasUserInteracted) {
                hasUserInteracted = true;
                speakText(words[currentIndex].en);
            }
        }, { once: true });

        window.onload = updateCard;
    </script>
</body>
</html>
