<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg?v=20260809-1" type="image/svg+xml">
    <link rel="shortcut icon" href="favicon.svg?v=20260809-1" type="image/svg+xml">
    <title>Module E 2027 Vocabulary Flashcards - Part A2</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        .counter {
            font-size: 0.95rem;
            color: var(--text-muted);
            background: #e0e7ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 480px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 380px;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: var(--shadow);
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            user-select: none;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #ffffff;
            overflow-y: auto;
        }

        /* Front Face Layout */
        .card-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pos-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            background: #f1f5f9;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .tts-btn {
            background: #eef2ff;
            border: none;
            color: var(--primary);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .tts-btn:hover {
            background: #e0e7ff;
        }

        .tts-btn:active {
            transform: scale(0.95);
        }

        .word-main-container {
            text-align: center;
            margin: auto 0;
        }

        .word-en {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .word-grammar {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .flip-hint {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        /* Back Face Layout */
        .translations-section {
            margin-bottom: 15px;
        }

        .trans-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 1.1rem;
        }

        .lang-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .trans-he {
            font-weight: 700;
            direction: rtl;
            color: var(--primary);
        }

        .trans-fr {
            font-weight: 700;
            color: #0d9488;
        }

        .synonyms-box {
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: none; /* Hidden by default if empty */
        }

        .example-box {
            background: #fdf2f8;
            border-left: 4px solid #db2777;
            padding: 10px 14px;
            border-radius: 0 10px 10px 0;
            font-size: 0.9rem;
        }

        .example-en {
            font-weight: 600;
            margin-bottom: 4px;
            color: #831843;
        }

        .example-trans {
            font-size: 0.85rem;
            color: #9d174d;
        }

        .example-trans.he {
            direction: rtl;
        }

        /* Navigation Controls */
        .nav-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
        }

        .nav-btn {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .nav-btn:active {
            transform: scale(0.97);
        }

        .nav-btn svg {
            width: 18px;
            height: 18px;
        }
        
        .jump-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .jump-container a {
            text-decoration: none;
            font-size: 0.85rem;
            padding: 8px 16px;
        }


        /* activity-accessibility-v1 */
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        .skip-link {
            position: fixed;
            top: -100px;
            left: 12px;
            z-index: 1000;
            padding: 10px 14px;
            border-radius: 8px;
            background: #111827;
            color: #ffffff;
            font-weight: 800;
            text-decoration: none;
        }

        .skip-link:focus {
            top: 12px;
        }

        .activity-top-nav {
            width: 100%;
            max-width: 480px;
            min-height: 44px;
            position: sticky;
            top: 8px;
            z-index: 40;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 6px;
            pointer-events: none;
        }

        .activity-home {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 13px;
            border: 1px solid #c7d2fe;
            border-radius: 12px;
            color: var(--primary-hover);
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 3px 10px rgba(30, 41, 59, 0.14);
            font-size: 0.85rem;
            font-weight: 750;
            line-height: 1;
            text-decoration: none;
            pointer-events: auto;
        }

        .activity-home:hover {
            background: #eef2ff;
        }

        .activity-home svg {
            width: 17px;
            height: 17px;
            flex: 0 0 auto;
        }

        .activity-main {
            width: 100%;
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sr-only {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #b45309;
            outline-offset: 4px;
        }

        .flip-btn {
            background-color: #ede9fe;
            border-color: #8b5cf6;
            color: #4c1d95;
        }

        .nav-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .nav-container .nav-btn {
            min-width: 0;
            justify-content: center;
            padding: 12px 10px;
        }

        .legal-footer {
            width: 100%;
            max-width: 640px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 16px;
            padding: 18px 10px 2px;
            color: var(--text-muted);
            font-size: 0.78rem;
            line-height: 1.5;
            text-align: center;
        }

        .legal-footer a {
            color: var(--primary-hover);
            font-weight: 700;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
            }

            .card,
            .tts-btn,
            .nav-btn {
                transition: none !important;
            }
        }

        @media (max-width: 380px) {
            .nav-container { gap: 6px; }
            .nav-container .nav-btn { padding: 10px 4px; font-size: 0.8rem; }
            .nav-container .nav-btn svg { display: none; }
        }

        @media (forced-colors: active) {
            .card,
            .card-face,
            .activity-home,
            .tts-btn,
            .nav-btn {
                border: 1px solid ButtonText;
            }
        }
    </style>

    <script>
        let currentIndex = 0;
        let hasUserInteracted = false;

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateCard() {
            if (typeof words === 'undefined' || words.length === 0) return;
            const item = words[currentIndex];
            
            const card = document.getElementById('flashcard');
            card.classList.remove('is-flipped');
            const cardFront = document.getElementById('cardFront');
            const cardBack = document.getElementById('cardBack');
            cardFront.setAttribute('aria-hidden', 'false');
            cardBack.setAttribute('aria-hidden', 'true');
            cardFront.inert = false;
            cardBack.inert = true;
            document.getElementById('ttsBtn').disabled = false;
            const flipButton = document.getElementById('flipButton');
            flipButton.setAttribute('aria-pressed', 'false');
            flipButton.textContent = 'Show answer';

            document.getElementById('posBadge').innerText = item.pos || '';
            document.getElementById('wordEn').innerText = item.en || '';
            document.getElementById('wordGrammar').innerText = item.grammar || '';
            document.getElementById('transHe').innerText = item.mean_he || '';
            
            // Hide synonyms box if empty
            if (item.synonyms && item.synonyms.length > 0) {
                document.getElementById('synonymsBox').style.display = 'block';
                document.getElementById('wordSynonyms').innerText = item.synonyms.join(', ');
            } else {
                document.getElementById('synonymsBox').style.display = 'none';
            }

            document.getElementById('exEn').innerText = item.ex_en || '';
            document.getElementById('exHe').innerText = item.ex_he || '';

            document.getElementById('counter').innerText = `${currentIndex + 1} / ${words.length}`;
            announceCard('word');
            
            if (hasUserInteracted) {
                speakText(item.en);
            }
        }

        function announceCard(side) {
            const item = words[currentIndex];
            const sideText = side === 'answer' ? 'Answer side' : 'Word side';
            document.getElementById('cardStatus').textContent =
                `Card ${currentIndex + 1} of ${words.length}. ${item.en}, ${item.pos}. ${sideText}.`;
        }

        function toggleCard(event) {
            if (event) event.stopPropagation();
            hasUserInteracted = true;
            const card = document.getElementById('flashcard');
            const isFlipped = card.classList.toggle('is-flipped');
            const cardFront = document.getElementById('cardFront');
            const cardBack = document.getElementById('cardBack');
            cardFront.setAttribute('aria-hidden', String(isFlipped));
            cardBack.setAttribute('aria-hidden', String(!isFlipped));
            cardFront.inert = isFlipped;
            cardBack.inert = !isFlipped;
            document.getElementById('ttsBtn').disabled = isFlipped;
            const flipButton = document.getElementById('flipButton');
            flipButton.setAttribute('aria-pressed', String(isFlipped));
            flipButton.textContent = isFlipped ? 'Show word' : 'Show answer';
            announceCard(isFlipped ? 'answer' : 'word');

            if (isFlipped) {
                speakText(words[currentIndex].ex_en);
            }
        }

        function nextCard() {
            hasUserInteracted = true;
            if (typeof words === 'undefined') return;
            currentIndex = (currentIndex + 1) % words.length;
            updateCard();
        }

        function prevCard() {
            hasUserInteracted = true;
            if (typeof words === 'undefined') return;
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            updateCard();
        }

        function playAudio(event) {
            hasUserInteracted = true;
            if (event) event.stopPropagation();
            if (typeof words === 'undefined') return;
            speakText(words[currentIndex].en);
        }

        let touchStartX = 0;
        let touchEndX = 0;
        const cardElement = document.getElementById('flashcard');

        cardElement.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        cardElement.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) {
                nextCard();
            }
            if (touchEndX > touchStartX + threshold) {
                prevCard();
            }
        }

        document.addEventListener('keydown', (event) => {
            if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
            if (event.key === 'ArrowRight') {
                event.preventDefault();
                nextCard();
            }
            if (event.key === 'ArrowLeft') {
                event.preventDefault();
                prevCard();
            }
        });


        window.onload = function() {
            updateCard();
        };
    </script>
</body>
