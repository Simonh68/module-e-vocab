<html lang="he" dir="rtl">
<head>

<title>WORD RIVALS · פיילוט Band III</title>
<style>
:root{color-scheme:dark;--bg:#0c1121;--panel:#141d32;--line:#2c3853;--text:#f0f4ff;--muted:#a8b7d0;--a:#6ae0c5;--b:#ffb17e;--focus:#dae8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#1b3050 0,transparent 48%),var(--bg);color:var(--text);font-family:Arial,"Noto Sans Hebrew",sans-serif;min-height:100vh}button,input{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:4px}a{color:var(--a)}button{border:1px solid var(--line);color:var(--text);background:var(--panel);border-radius:12px;padding:12px 18px;min-height:46px}button.primary{background:var(--a);color:#0d2528;border:0;font-weight:700}button.quiet{background:transparent;color:var(--muted)}button:hover:not(:disabled){filter:brightness(1.15)}.shell{max-width:1100px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{font-size:22px;font-weight:800;letter-spacing:1px}.brand span{color:var(--a)}.pill{font-size:12px;padding:7px 11px;border:1px solid var(--line);border-radius:30px;color:var(--muted)}.topTools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.topTools button{font-size:13px;min-height:38px;padding:8px 11px}.hero{max-width:730px;margin:64px auto 30px;text-align:center}.eyebrow{color:var(--a);font-size:12px;letter-spacing:2px;font-weight:700}.hero h1{font-size:clamp(34px,6vw,58px);letter-spacing:-1px;line-height:1.1;margin:16px 0}.hero p{color:var(--muted);line-height:1.8;font-size:18px}.intro{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:32px 0}.intro div{background:#172238;border:1px solid var(--line);padding:20px 12px;border-radius:18px}.intro strong{display:block;font-size:23px;margin-bottom:9px;color:var(--a)}.intro span{font-size:14px;color:var(--muted);line-height:1.6}.entry{display:flex;justify-content:center;align-items:stretch;gap:12px;flex-wrap:wrap;margin:25px 0}.join{display:flex;gap:7px}.join input{max-width:165px;width:42vw;border:1px solid var(--line);border-radius:12px;background:#0e1729;color:var(--text);padding:12px;text-align:center;letter-spacing:2px;direction:ltr;text-transform:uppercase}.small{font-size:13px!important;color:var(--muted);line-height:1.7}.callout{background:#162a34;border:1px solid #2e6264;border-radius:14px;padding:16px;margin:20px 0;line-height:1.7}.lobby{max-width:560px;margin:65px auto;text-align:center}.code{font-size:34px;letter-spacing:7px;direction:ltr;font-weight:700;margin:22px 0;user-select:all}.people{display:flex;justify-content:center;gap:22px;margin:24px}.person{padding:18px;border:1px solid var(--line);border-radius:16px;min-width:130px}.person small{display:block;color:var(--muted);margin-top:12px}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin:30px 0 18px}.scorecard{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px 18px;display:flex;align-items:center;gap:14px}.scorecard.active{box-shadow:0 0 0 2px currentColor}.scorecard.player0{color:var(--a)}.scorecard.player1{color:var(--b)}.scorecard .num{font-size:34px;font-weight:800;line-height:1}.scorecard .detail{font-size:12px;color:var(--muted);line-height:1.7}.scorecard .name{font-weight:700;margin-bottom:5px}.middle{text-align:center}.middle strong{display:block;font-size:20px}.middle small{color:var(--muted);font-size:12px;line-height:1.6}.turnbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-radius:13px;background:#1c2940;border:1px solid var(--line);margin-bottom:18px}.turnbar strong{font-size:16px}.turnbar span{color:var(--muted);font-size:13px}.arena{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start;direction:ltr}.boardwrap,.missions{direction:rtl}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;direction:ltr}.tile{min-width:0;height:107px;position:relative;padding:11px 4px;border-radius:14px;border:1px solid #394767;background:linear-gradient(160deg,#222f48,#172138);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;color:#f6f8ff;transition:transform .15s,border-color .15s,background .25s;opacity:1!important}.tile .word{font-size:clamp(13px,2.2vw,20px);font-weight:700;max-width:100%;letter-spacing:-.2px}.tile .word.long{font-size:clamp(11px,1.8vw,17px)}.tile .pos{font-size:10px;letter-spacing:.7px;color:#b9c7df}.tile .owner{position:absolute;top:6px;left:8px;font-size:12px}.tile .corner{position:absolute;top:6px;right:8px;color:#c6d2e8;font-size:11px}.tile.owned0{background:linear-gradient(160deg,#184840,#15302f);border-color:#3b8d7d}.tile.owned1{background:linear-gradient(160deg,#55392e,#342720);border-color:#a17250}.tile.selected{box-shadow:inset 0 0 0 3px #f3f7ff;transform:translateY(-3px)}.tile.correct{box-shadow:inset 0 0 0 3px var(--a)}.tile.wrong{box-shadow:inset 0 0 0 3px #f692aa}.boardlegend{display:flex;justify-content:space-between;gap:10px;margin:15px 2px;font-size:12px;color:var(--muted)}.panel{padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.panel h2{font-size:18px;margin:0 0 10px}.panel p{color:var(--muted);font-size:14px;line-height:1.65}.mission{display:block;text-align:left;direction:ltr;width:100%;padding:14px;margin:10px 0;background:#1a2940;border:1px solid #344666}.mission b{font-size:15px;display:block}.mission small{display:block;font-size:12px;line-height:1.5;color:var(--muted);margin-top:6px}.mission.link{border-color:#7a6caf;background:linear-gradient(110deg,#2a2744,#1a2940)}.mission span.tag{display:block;font-size:10px;color:var(--a);letter-spacing:1px;margin-bottom:7px}.clue{font-size:19px!important;line-height:1.65!important;color:var(--text)!important;direction:ltr;text-align:left;background:#0f192c;border-inline-start:3px solid var(--a);padding:18px;border-radius:5px;margin:16px 0}.selection{min-height:24px;color:var(--a);font-size:13px;margin:15px 0;direction:ltr;text-align:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.statusnote{margin:15px 0;color:var(--muted);font-size:13px;line-height:1.6}.feedbackHead{font-size:22px!important;color:var(--a)!important}.feedbackHead.no{color:var(--b)!important}.answerword{border-top:1px solid var(--line);padding:12px 0;font-size:14px;line-height:1.6}.answerword b{color:var(--a);font-size:19px}.answerword .def{direction:ltr;text-align:left}.answerword .example{color:var(--muted);font-style:italic;direction:ltr;text-align:left}.answerword .gloss{font-size:12px;color:var(--muted)}.answerword button{font-size:12px;padding:5px 8px;min-height:32px;margin-top:6px}.result{max-width:760px;margin:28px auto}.result .winner{text-align:center;padding:28px}.winner h1{font-size:35px;margin:14px 0}.reviewgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}.rules{max-width:700px;line-height:1.8}.rules li{margin:9px 0}.overlay{position:fixed;inset:0;background:#080e1bd9;display:grid;place-items:center;padding:20px;z-index:20;overflow:auto}.dialog{max-width:640px;max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}.dialog button.close{float:left}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:90vw;background:#e9f3ff;color:#132035;box-shadow:0 8px 32px #0005;border-radius:13px;padding:14px 22px;z-index:30;line-height:1.5;text-align:center}.footer{border-top:1px solid var(--line);margin-top:35px;padding:18px 0;color:var(--muted);font-size:12px;line-height:1.8;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.warning{background:#3b2b25;border:1px solid #b58a66;padding:12px;border-radius:12px;color:#ffd3ad;line-height:1.6;margin:12px 0}.progress{height:4px;border-radius:10px;background:#2b3750;overflow:hidden;margin-bottom:20px}.progress>div{height:100%;background:var(--a)}.hidden{display:none!important}
@media(max-width:760px){.shell{padding:16px}.hero{margin-top:40px}.hero p{font-size:16px}.intro{gap:8px}.intro div{padding:16px 8px}.intro span{font-size:12px}.arena{grid-template-columns:1fr;gap:14px}.missions{grid-row:1}.panel{padding:16px}.choosegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mission{padding:10px;margin:5px 0}.mission b{font-size:12px}.mission small{font-size:11px}.scorebar{gap:9px;margin-top:22px}.scorecard{padding:12px 10px;gap:8px}.scorecard .num{font-size:27px}.scorecard .name{font-size:13px}.scorecard .detail{font-size:10px}.middle strong{font-size:16px}.middle small{font-size:10px}.tile{height:87px}.tile .word{font-size:clamp(12px,3.4vw,19px)}.tile .word.long{font-size:clamp(11px,2.95vw,17px)}.board{gap:7px}.clue{font-size:16px!important;margin:10px 0;padding:12px}.turnbar{padding:12px;align-items:flex-start;flex-direction:column;gap:5px}.reviewgrid{grid-template-columns:1fr}.boardlegend{font-size:11px}.code{font-size:29px}.top{gap:10px}.brand{font-size:19px}}
@media(max-width:760px){.actions{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:10px 16px;background:#0e1729f5;border-top:1px solid var(--line);box-shadow:0 -8px 24px #0004}.arena:has(#submit){padding-bottom:65px}.mission small{font-size:12px}.choosegrid{gap:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<div class="shell">
<header class="top"><div class="brand" dir="ltr">WORD <span>RIVALS</span></div><div class="topTools"><span class="pill">Band III · פיילוט 0.1</span><button id="rulesBtn" class="quiet">איך משחקים?</button></div></header>
<main id="app"></main>
<footer class="footer"><span>English for Noar · משחק תרגול, לא מבחן ולא קביעת רמה.</span><span>בלי חשבון · בלי שמות · בלי צ׳אט · בלי מעקב</span></footer>
</div><div id="notice" class="toast hidden" role="status" aria-live="polite"></div><div id="modal" class="hidden"></div>
<noscript>המשחק זקוק להפעלת JavaScript בדפדפן.</noscript>
<!--OFFLINE_CORE-->
<script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app');
const labels=['◈ ירקן','▲ ענבר'];
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let room=null,local=false,localGame=null,selected=[],stream=null,busy=false,connected=true,lastVersion=null,lastPhase=null,toastTimer=null;
const roomFromURL=()=>new URLSearchParams(location.search).get('room')||'';
function notify(text){clearTimeout(toastTimer);$('#notice').textContent=text;$('#notice').classList.remove('hidden');toastTimer=setTimeout(()=>$('#notice').classList.add('hidden'),4500);}
const errorText={ 'Not your turn':'זהו תורו של השחקן השני.','Stale move; refresh the board':'הלוח כבר עודכן. הפעולה לא בוצעה פעמיים.','Room not found or expired':'החדר לא נמצא או שתוקפו פג. פתחו חדר חדש.','This room already has two players':'בחדר כבר נמצאים שני שחקנים.','Join this room first':'יש להצטרף לחדר תחילה.','Waiting for the other player to reconnect':'ממתינים לחיבור מחדש של השחקן השני.','Both players must be connected':'שני השחקנים צריכים להיות מחוברים.','Please wait a moment':'לחיצה מהירה מדי. נסו שוב.','Invalid room code':'קוד החדר כולל שמונה תווים: ספרות והאותיות A–F.'};
async function request(path,body){const response=await fetch(path,body===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(data.error||'שגיאת חיבור');return data;}
function setState(s){if(!local&&room?.matchId&&s.matchId===room.matchId&&s.game?.version<room.game?.version)return;if(s.game?.version!==lastVersion||s.game?.phase!==lastPhase){selected=[];lastVersion=s.game?.version;lastPhase=s.game?.phase;}room=s;render();}
function lobbyScreen(){
 const offline=!!window.WRCore;
 app.innerHTML=`<section class="hero"><div class="eyebrow" dir="ltr">WORDS. CONNECTIONS. RIVALRY.</div><h1>מילה טובה.<br>מהלך חכם.</h1><p>זהו מילים לפי רמזים באנגלית, חברו ביניהן<br>וכבשו את הלוח — אחד מול השני.</p><div class="intro"><div><strong>2</strong><span>שחקנים אמיתיים<br>ללא שחקן מחשב</span></div><div><strong>16</strong><span>מילים מ־Band III<br>בכל משחק</span></div><div><strong>6</strong><span>תורות לכל שחקן<br>בלי לחץ זמן</span></div></div>${offline?`<div class="callout">זו גרסת ההתנסות המקומית: שני שחקנים באותו מכשיר, בתורות.<br>היא אינה מחברת שני טלפונים דרך האינטרנט.</div><div class="entry"><button class="primary" id="localStart">מתחילים דו־קרב באותו מכשיר</button></div>`:`<div class="entry"><button class="primary" id="create">פתיחת חדר לשניים</button><form class="join" id="joinForm"><label class="hidden" for="code">קוד חדר</label><input id="code" aria-label="קוד חדר" placeholder="קוד חדר" maxlength="8" autocomplete="off" autocapitalize="characters" value="${safe(roomFromURL())}"><button type="submit">הצטרפות</button></form></div><p class="small">חדר מקוון עובד בין מכשירים המחוברים לאותו שרת פיילוט.<br><a href="./demo.html">להתנסות של שני שחקנים באותו מכשיר</a></p>`}<p class="small">המנצח נקבע לפי השטחים שנותרו בידו: נקודה למילה,<br>ועוד 2 נקודות לכל שורה או עמודה מלאה.</p></section>`;
 if(offline)$('#localStart').onclick=startLocal;
 else{$('#create').onclick=()=>connectAction('/api/create',{});$('#joinForm').onsubmit=e=>{e.preventDefault();connectAction('/api/join',{code:$('#code').value});};}
}
function startLocal(){local=true;localGame=WRCore.createGame(crypto.getRandomValues(new Uint32Array(1))[0],Math.random()<.5?0:1);lastVersion=null;setState({status:'playing',you:null,players:2,online:[true,true],game:WRCore.publicState(localGame)});}
async function connectAction(path,data){if(busy)return;busy=true;try{const s=await request(path,data);history.replaceState(null,'',`?room=${s.code}`);setState(s);openStream(s.code);}catch(e){notify(errorText[e.message]||'החיבור לא הצליח. בדקו שהשרת פועל.');}finally{busy=false;}}
function openStream(code){if(stream)stream.close();stream=new EventSource(`/events?room=${code}`);stream.onopen=()=>{connected=true;if(room)render();};stream.onmessage=e=>{try{setState(JSON.parse(e.data));}catch(_){notify('התקבל עדכון לא תקין.');}};stream.onerror=()=>{connected=false;if(room)render();};stream.addEventListener('expired',()=>{stream.close();room=null;history.replaceState(null,'',location.pathname);lobbyScreen();notify('תוקף החדר פג. נתוני המשחק הזמניים נמחקו.');});}
async function act(action){if(busy)return;busy=true;const version=room?.game?.version;try{if(local){WRCore.apply(localGame,localGame.active,{...action,version});setState({...room,game:WRCore.publicState(localGame)});}else{setState(await request(`/api/action?room=${room.code}`,{...action,version,matchId:room.matchId}));}}catch(e){notify(errorText[e.message]||'לא ניתן לבצע את הפעולה. נסו שוב.');if(!local&&room)try{setState(await request(`/api/state?room=${room.code}`));}catch(_){}}finally{busy=false;}}
function render(){if(!room)return lobbyScreen();if(room.status==='lobby')return renderLobby();if(room.game?.phase==='over')return renderEnd();renderGame();}
function renderLobby(){app.innerHTML=`<section class="lobby"><div class="eyebrow">חדר פרטי לשני שחקנים</div><h1>מזמינים יריב לזירה</h1><p class="small">שתפו את הקישור או את הקוד. אין צורך בשם.</p><div class="code">${safe(room.code)}</div><button id="copy">העתקת קישור לחדר</button><div class="people">${[0,1].map(i=>`<div class="person">${labels[i]}<small>${room.online[i]?'מחובר/ת':'ממתינים לחיבור'}</small></div>`).join('')}</div><p class="small">${room.you===0?'כששניכם מחוברים, אפשר להתחיל.':'ממתינים לפותח/ת החדר להתחלת המשחק.'}</p><button class="primary" id="start" ${room.you!==0||room.players!==2||!room.online.every(Boolean)?'disabled':''}>כניסה לזירה</button>${!connected?'<div class="warning">החיבור נותק. מנסים להתחבר מחדש; המשחק לא מתחיל.</div>':''}</section>`;$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);notify('קישור ההזמנה הועתק.');}catch(_){notify('קוד החדר: '+room.code);}};$('#start').onclick=()=>act({type:'start'});}
function scoreHTML(g){return`<div class="scorebar">${scoreCard(g,0)}<div class="middle"><strong dir="ltr">${Math.min(6,Math.floor(g.turn/2)+1)} / 6</strong><small>סבב<br>${local?'אותו מכשיר':'שני מכשירים'}</small></div>${scoreCard(g,1)}</div><div class="progress"><div style="width:${g.turn/g.totalTurns*100}%"></div></div>`;}
function scoreCard(g,p){return`<div class="scorecard player${p} ${g.active===p&&g.phase!=='over'?'active':''}"><div class="num">${g.scores[p].total}</div><div><div class="name">${labels[p]}${!local&&room.you===p?' · אני':''}</div><div class="detail">${g.scores[p].tiles} מילים · ${g.scores[p].lines} קווים<br>${g.moves[p]} מתוך 6 תורות</div></div></div>`;}
function canAct(g){return(local||room.you===g.active)&&(local||(connected&&room.online.length===2&&room.online.every(Boolean)));}
function renderGame(){
 const g=room.game,m=g.missions.find(m=>m.id===g.selected),mine=canAct(g),f=g.feedback;
 const status=g.phase==='review'?(local?`מעבירים ל${labels[g.active]} · קוראים את המשוב וממשיכים`:`תוצאת המהלך של ${labels[f.actor]}`):`${labels[g.active]} · ${local?'התור שלך':room.you===g.active?'התור שלי':'תור היריב'}`;
 app.innerHTML=`${scoreHTML(g)}${!local&&(!connected||!room.online.every(Boolean))?'<div class="warning" role="status">המשחק מושהה עד ששני השחקנים מתחברים. שום תור לא הולך לאיבוד.</div>':''}<div class="turnbar" role="status"><strong>${status}</strong><span>${g.phase==='choose'?'בוחרים מהלך. אחר כך מסמנים את המילים.':g.phase==='answer'?`סמנו ${m.count===1?'מילה אחת':'שתי מילים'} בלוח ואשרו.`:'כל מילה מסומנת במשוב עם המשמעות והדוגמה.'}</span></div><div class="arena"><div class="boardwrap"><div class="board" aria-label="לוח כיבוש מילים">${g.board.map((t,i)=>{const allowed=mine&&g.phase==='answer'&&t.owner!==g.active;const cls=['tile',t.owner!==null?'owned'+t.owner:'',selected.includes(t.id)?'selected':'',f?.correct.includes(t.id)?'correct':'',f?.chosen.includes(t.id)&&!f.ok&&!f.correct.includes(t.id)?'wrong':''].join(' ');return`<button class="${cls}" data-word="${t.id}" ${allowed?'':'disabled'} aria-label="${safe(t.en)}, ${safe(t.pos)}, ${t.owner===null?'פנוי':labels[t.owner]}" aria-pressed="${selected.includes(t.id)}"><span class="owner">${t.owner===0?'◈':t.owner===1?'▲':''}</span><span class="corner">${i+1}</span><span class="word ${t.en.length>11?'long':''}" lang="en">${safe(t.en)}</span><span class="pos" lang="en">${safe(t.pos)}</span></button>`;}).join('')}</div><div class="boardlegend"><span>◈ ירקן &nbsp; ▲ ענבר</span><span>שורה או עמודה מלאה = 2+ נקודות</span></div><p class="small">אפשר לכבוש גם מילה של היריב. אי אפשר לבחור מילה שכבר שייכת לך.</p></div><aside class="missions panel">${g.phase==='choose'?`<h2>איזה מהלך מתאים ללוח?</h2><p>${mine?'בחרו רמז לפי המילים והשטחים שתרצו לכבוש.':'אפשר לקרוא את הרמזים ולתכנן את התור הבא.'}</p><div class="choosegrid">${g.missions.map(x=>`<button class="mission ${x.kind==='link'?'link':''}" data-mission="${x.id}" ${mine?'':'disabled'}><span class="tag">${x.count===2?'LINK · 2 WORDS':x.kind==='rival'?'RECLAIM · 1 WORD':'FOCUS · 1 WORD'}</span><b lang="en">${safe(x.title)}</b><small lang="en">${safe(x.clue)}</small></button>`).join('')}</div><p class="statusnote">מהלך כפול מצליח רק אם שתי המילים נכונות. טעות מסיימת תור — בלי אובדן שטחים קיימים.</p>${mine?'<button id="pass" class="quiet">דילוג על התור</button>':''}`:g.phase==='answer'?`<div class="eyebrow" dir="ltr">${m.count===2?'LINK TWO WORDS':'FIND THE WORD'}</div><p class="clue" lang="en">${safe(m.clue)}</p><div class="selection">${selected.length?selected.map(id=>safe(g.board.find(t=>t.id===id).en)).join(' + '):mine?'בחרו מילים מתוך הלוח':'היריב בוחר מילים...'}</div><div class="actions"><button id="submit" class="primary" ${mine&&selected.length===m.count?'':'disabled'}>אישור המהלך · ${selected.length}/${m.count}</button>${mine?'<button id="pass" class="quiet">דילוג</button>':''}</div><p class="statusnote">אין ניקוד על מהירות. לאחר האישור ייחשפו המשמעות והדוגמה.</p>`:feedbackHTML(g)}</aside></div>`;
 app.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>act({type:'choose',missionId:b.dataset.mission}));
 app.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{const id=b.dataset.word;if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<m.count)selected.push(id);else{notify('בטלו בחירה קיימת לפני בחירת מילה אחרת.');return;}renderGame();});
 if($('#submit'))$('#submit').onclick=()=>act({type:'answer',ids:[...selected]});
 if($('#pass'))$('#pass').onclick=()=>{if(confirm('לדלג? התור יסתיים ללא כיבוש מילה.'))act({type:'pass'});};
 if($('#continue'))$('#continue').onclick=()=>act({type:'continue'});bindSpeech();
}
function wordReview(w){return`<div class="answerword"><div dir="ltr"><b lang="en">${safe(w.en)}</b> <span class="small">${safe(w.pos)}</span></div><div class="def" lang="en">${safe(w.definition)}</div><div class="example" lang="en">${safe(w.example)}</div><div class="gloss">${safe(w.he)} · ${safe(w.id)}</div><button class="quiet" data-speak="${safe(w.en)}" aria-label="הקראה מקומית של ${safe(w.en)}">◖ הקראה</button></div>`;}
function feedbackHTML(g){const f=g.feedback;return`<h2 class="feedbackHead ${f.ok?'':'no'}">${f.passed?'התור דולג':f.ok?'מהלך מוצלח!':'הפעם אין כיבוש'}</h2><p>${f.passed?'השטחים נשארו כפי שהיו.':f.ok?`${labels[f.actor]} כבש/ה ${f.captured.length} ${f.captured.length===1?'מילה':'מילים'}${f.stolen.length?' — כולל שטח מהיריב':''}.`:'אלה המילים שמתאימות לרמז. קראו את הקשר ונסו להשתמש בו בהמשך.'}</p>${f.words.map(wordReview).join('')}<button id="continue" class="primary" ${canAct(g)?'':'disabled'}>${g.turn>=g.totalTurns?'לתוצאות המשחק':local?`התור של ${labels[g.active]}`:room.you===g.active?'להתחלת התור שלי':'ממתינים ליריב'}</button>`;}
function renderEnd(){const g=room.game;app.innerHTML=`${scoreHTML(g)}<section class="result"><div class="panel winner"><div class="eyebrow" dir="ltr">MATCH COMPLETE</div><h1>${g.winners.length===2?'תיקו — קרב שקול!':labels[g.winners[0]]+' ניצח/ה!'}</h1><p>הניקוד הוא תוצאת משחק בלבד, לא ציון באנגלית.</p><div class="entry"><button class="primary" id="rematch" ${!local&&room.rematch[room.you]?'disabled':''}>${!local&&room.rematch[room.you]?'ממתינים להסכמת היריב':'משחק חוזר · לוח חדש'}</button><button id="reviewToggle">המילים שפגשנו</button></div><p class="small">במשחק חוזר השחקן שפתח מתחלף. אפשר לסיים כאן — אין רצף שחייבים לשמור.</p></div><div id="reviewList" class="panel hidden" style="margin-top:18px"><h2>מפגש נוסף עם המילים</h2><p class="small">קראו את הדוגמאות. זיהוי בלוח אינו מעיד בהכרח על שליטה עצמאית במילה.</p><div class="reviewgrid">${g.review.map(wordReview).join('')}</div></div></section>`;$('#rematch').onclick=()=>{if(local){const starter=1-localGame.starter;localGame=WRCore.createGame(crypto.getRandomValues(new Uint32Array(1))[0],starter);lastVersion=null;setState({...room,game:WRCore.publicState(localGame)});}else act({type:'rematch'});};$('#reviewToggle').onclick=()=>$('#reviewList').classList.toggle('hidden');bindSpeech();}
function bindSpeech(){app.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{if(!('speechSynthesis'in window))return notify('אין הקראה זמינה בדפדפן זה.');const voices=speechSynthesis.getVoices(),voice=voices.find(v=>v.localService&&/^en[-_]US$/i.test(v.lang));if(!voice)return notify('לא נמצא קול אמריקאי מקומי. לא תופעל הקראה דרך שירות חיצוני.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.dataset.speak);u.voice=voice;u.lang='en-US';u.rate=.9;speechSynthesis.speak(u);});}
function silence(){if('speechSynthesis'in window)speechSynthesis.cancel();}document.addEventListener('visibilitychange',()=>{if(document.hidden)silence();});window.addEventListener('pagehide',silence);
function closeRules(){const modal=$('#modal');modal.className='hidden';modal.innerHTML='';$('#rulesBtn').focus();}
$('#rulesBtn').onclick=()=>{const modal=$('#modal');modal.className='overlay';modal.innerHTML=`<section class="dialog rules" role="dialog" aria-modal="true" aria-labelledby="rulesTitle"><button class="close" id="closeRules">סגירה</button><h2 id="rulesTitle">איך כובשים את הלוח?</h2><ol><li>שני שחקנים, 6 תורות לכל אחד. אין הגבלת זמן ואין פרס ללחיצה מהירה.</li><li>בכל תור בוחרים אחד מהרמזים באנגלית. הרמז מציין אם צריך לבחור מילה אחת או שתיים.</li><li>מסמנים את המילים בלוח ולוחצים על אישור. אם כל הבחירות נכונות — המילים עוברות לצבע שלכם, גם אם היו שייכות ליריב.</li><li>טעות אינה מוחקת שטחים שכבר כבשתם, אך מסיימת את התור. שתי בחירות במהלך כפול חייבות להיות נכונות.</li><li>בסיום: נקודה לכל מילה שבידיכם, ועוד 2 נקודות לכל שורה או עמודה מלאה בצבע שלכם. הניקוד משתנה כששטח עובר ליריב.</li></ol><p><strong>מדגם התוכן:</strong> 16 מילים מקבוצות A1–A3 של Band III באתר. אלה קבוצות מילים, לא שלוש דרגות קושי. הרמזים הם תוכן פיילוט חדש.</p><p><strong>פרטיות:</strong> במצב המקומי המשחק בזיכרון הדפדפן בלבד. במצב שני מכשירים נשלחים מזהי מילים ופעולות לצורך ניהול החדר; אין שמות, צ׳אט, אנליטיקה או מאגר תשובות. חדר השרת פג לאחר 30 דקות ללא פעולה או אחרי שעתיים לכל היותר. סגירת לשונית אינה מוחקת את החדר מיד.</p><p>אין יתרון בתשלום, אין שחקנים מדומים ואין דירוג תלמידים. איזון בין רמות שונות אינו נכלל בפיילוט.</p></section>`;$('#closeRules').onclick=closeRules;$('#closeRules').focus();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeRules();if(e.key==='Tab'&&!$('#modal').classList.contains('hidden')){const b=$('#closeRules');e.preventDefault();b.focus();}});
(async()=>{lobbyScreen();if(!window.WRCore&&/^[0-9a-f]{8}$/i.test(roomFromURL())){try{const s=await request(`/api/state?room=${roomFromURL()}`);setState(s);openStream(s.code);}catch(_){}}})();
</script>
