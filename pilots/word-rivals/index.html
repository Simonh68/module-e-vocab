<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WORD RIVALS</title><style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101c31;--line:#30496d;--text:#f5f8ff;--muted:#a7b7cf;--cyan:#5ef2dc;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 5%,#183d68,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}button,input{font:inherit}.hidden{display:none!important}.shell{max-width:1180px;margin:auto;padding:24px 16px}.top{display:flex;justify-content:space-between}.brand{font-weight:950;font-size:22px}.brand b{color:var(--cyan)}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--muted)}.hero{text-align:center;max-width:820px;margin:70px auto}.hero h1{font-size:clamp(44px,8vw,78px);margin:12px}.hero p{color:var(--muted);font-size:19px}.entry,.decision{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.primary,.secondary,.answer{border:0;border-radius:15px;padding:14px 20px;font-weight:850;min-height:50px}.primary{background:var(--cyan);color:#06121f}.secondary,.answer{background:#142540;color:var(--text);border:1px solid var(--line)}input{width:140px;border-radius:15px;padding:13px;background:#091426;color:white;border:1px solid var(--line);text-align:center;direction:ltr;letter-spacing:6px}.room,.game,.end{max-width:1000px;margin:38px auto}.card{background:linear-gradient(160deg,#13223b,#0c1728);border:1px solid var(--line);border-radius:26px;padding:24px}.code{font-size:clamp(48px,9vw,82px);font-weight:950;letter-spacing:12px;color:var(--gold);text-align:center;direction:ltr}.notice{text-align:center;border:1px solid #42638d;border-radius:16px;padding:14px;margin:15px 0}.players,.hud,.requests{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin:14px 0}.chip,.score{background:#0b1627;border:1px solid var(--line);border-radius:15px;padding:12px}.score.active{box-shadow:0 0 0 4px var(--gold),0 0 32px #ffd16688;background:#27304a;transform:scale(1.04)}.score.active:before{content:'▶ התור עכשיו';display:block;color:var(--gold);font-weight:950;font-size:14px;margin-bottom:6px}.score strong{font-size:28px}.turn{display:flex;justify-content:space-between;color:var(--muted);margin:14px}.band{text-align:center;color:var(--gold);font-weight:900}.word{direction:ltr;text-align:center;font-size:clamp(50px,9vw,96px);font-weight:950;margin:20px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer.he{direction:rtl;text-align:right}.answer.en{direction:ltr;text-align:left}.hebrew{text-align:right;direction:rtl}.english{text-align:left;direction:ltr}.speak{border:1px solid var(--line);background:#0b1627;color:var(--cyan);border-radius:999px;width:44px;height:44px;margin-inline-start:10px}.wordRow{display:flex;direction:ltr;align-items:center;justify-content:center}.choiceRow{display:flex;direction:ltr;align-items:center;gap:8px}.choiceRow .answer{flex:1}.wait{text-align:center;color:var(--muted);font-size:20px;padding:24px}.feedback{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:14px}@media(max-width:700px){.answers{grid-template-columns:1fr}}@media(min-width:900px){body.spectating .word{font-size:108px}body.spectating .answer{font-size:24px;padding:22px}}
</style></head><body><div class="shell"><div class="top"><div class="brand">WORD <b>RIVALS</b></div><div class="badge">Band II → BANK / RAISE → Band III</div></div>
<section id="home" class="hero"><div class="badge">Battle Room</div><h1>בטוח או להעלות?</h1><p>Band II נכון נותן 100 זמניות. BANK שומר אותן; RAISE מסכן אותן עבור 250 ב־Band III.</p><div class="entry"><button id="create" class="primary">צור חדר</button><input id="codeInput" maxlength="5" inputmode="numeric" pattern="[0-9]*" placeholder="12345"><button id="join" class="secondary">צפה בחדר</button></div></section>
<section id="lobby" class="room hidden"><div class="card"><div class="badge">קוד חדר · כניסה בקישור היא לצפייה</div><div id="roomCode" class="code"></div><div id="roleBox" class="notice"></div><div id="players" class="players"></div><div id="requests" class="requests"></div><div class="entry"><button id="requestPlayer" class="secondary hidden">בקש להצטרף כשחקן</button><button id="start" class="primary hidden">התחל משחק</button></div></div></section>
<section id="game" class="game hidden"><div id="roleGame" class="notice hidden"></div><div id="hud" class="hud"></div><div id="whoseTurn" class="notice" style="font-size:clamp(24px,4vw,38px);font-weight:950;color:var(--gold)"></div><div class="turn"><span id="turnText"></span><span id="riskText"></span></div><div class="card"><div id="questionArea"></div><div id="feedback" class="feedback hidden"></div></div></section>
<section id="end" class="end hidden"><div class="card" style="text-align:center"><div style="font-size:72px">🏆</div><h1 id="winner"></h1><div id="finalScores" class="players"></div><button class="primary" onclick="location.href=location.pathname">חדר חדש</button></div></section></div>
<script>
let state=null,stream=null,matchId=null;const $=id=>document.getElementById(id),show=id=>['home','lobby','game','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id));function toast(t){alert(t)}async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}function connect(code){if(stream)stream.close();stream=new EventSource('/events?room='+code);stream.onmessage=e=>render(JSON.parse(e.data));stream.addEventListener('expired',()=>location.href=location.pathname)}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}
function render(s){state=s;matchId=s.matchId||matchId;document.body.classList.toggle('spectating',s.role==='spectator');if(s.status==='lobby'){show('lobby');$('roomCode').textContent=s.code;$('players').innerHTML=Array.from({length:s.players},(_,i)=>'<div class="chip"><b>שחקן '+(i+1)+'</b></div>').join('');$('roleBox').textContent=s.role==='spectator'?(s.requested?'בקשת ההצטרפות נשלחה לשחקן 1.':'אתה צופה ואינך תופס מקום של שחקן.'):'אתה שחקן '+(s.you+1);$('requestPlayer').classList.toggle('hidden',s.role!=='spectator'||s.requested);$('start').classList.toggle('hidden',!(s.role==='player'&&s.you===0));$('start').disabled=s.players<2;$('requests').innerHTML=(s.requests||[]).map((t,i)=>'<div class="chip">בקשת הצטרפות '+(i+1)+'<br><button class="primary" data-ok="'+esc(t)+'">אשר</button> <button class="secondary" data-no="'+esc(t)+'">דחה</button></div>').join('');$('requests').querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>manage('approve',b.dataset.ok));$('requests').querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>manage('reject',b.dataset.no));return}if(s.game?.phase==='over'){show('end');$('winner').textContent=s.game.winners.length>1?'תיקו':'שחקן '+(s.game.winners[0]+1)+' ניצח!';$('finalScores').innerHTML=s.game.scores.map((v,i)=>'<div class="chip">שחקן '+(i+1)+'<br><b>'+v+'</b></div>').join('');return}show('game');const g=s.game;$('roleGame').classList.toggle('hidden',s.role!=='spectator');$('roleGame').textContent='מצב צפייה · אי אפשר לענות. אפשר להצטרף כשחקן במשחק הבא.';$('hud').innerHTML=g.scores.map((v,i)=>'<div class="score '+(i===g.active?'active':'')+'">שחקן '+(i+1)+'<br><strong>'+v+'</strong><br>🔥 '+g.streaks[i]+'</div>').join('');$('whoseTurn').textContent='🎯 עכשיו תורו של שחקן '+(g.active+1);$('turnText').textContent='תור '+(g.turn+1)+' / '+g.totalTurns+' · שחקן '+(g.active+1);$('riskText').textContent=g.step==='band3'?'RAISE · 250 או 0':g.step==='decision'?'100 על השולחן':'Band II · 100';const mine=s.role==='player'&&s.you===g.active,qa=$('questionArea');if(g.step==='decision'){qa.innerHTML=mine?'<div class="band">Band II נכון · 100 זמניות</div><div class="decision"><button class="primary" id="bank">BANK · קח 100</button><button class="primary" style="background:var(--gold)" id="raise">RAISE · נסה 250</button></div>':'<div class="wait">שחקן '+(g.active+1)+' מחליט: BANK או RAISE…</div>';if(mine){$('bank').onclick=()=>move('bank');$('raise').onclick=()=>move('raise')}}else if(g.question){const he=g.question.band==='band2';qa.innerHTML='<div class="band">'+(he?'Band II · בטוח':'Band III · סיכון גבוה')+'</div><div class="wordRow"><div class="word english">'+esc(g.question.prompt)+'</div><button type="button" class="speak" data-speak="'+esc(g.question.prompt)+'" aria-label="השמע '+esc(g.question.prompt)+'">🔊</button></div><div class="answers">'+g.question.choices.map(c=>he?'<button class="answer he" '+(mine?'data-id="'+esc(c.id)+'"':'disabled')+'>'+esc(c.text)+'</button>':'<div class="choiceRow"><button class="answer en" '+(mine?'data-id="'+esc(c.id)+'"':'disabled')+'>'+esc(c.text)+'</button><button type="button" class="speak" data-speak="'+esc(c.text)+'" aria-label="השמע תשובה">🔊</button></div>').join('')+'</div>'+(mine?'':'<div class="wait">שחקן '+(g.active+1)+' עונה עכשיו…</div>');qa.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>answer(b.dataset.id));qa.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak))}const f=$('feedback');if(g.feedback){f.classList.remove('hidden');f.textContent=(g.feedback.ok?'✓ נכון':'✕ לא הפעם')+(g.feedback.gain?' · +'+g.feedback.gain:'')+(g.feedback.bonus?' · בונוס +'+g.feedback.bonus:'')}else f.classList.add('hidden')}
async function answer(id){try{await api('/api/action?room='+state.code,{type:'answer',choiceId:id,version:state.game.version,matchId})}catch(e){toast(e.message)}}async function move(type){try{await api('/api/action?room='+state.code,{type,version:state.game.version,matchId})}catch(e){toast(e.message)}}async function manage(type,requestToken){try{await api('/api/action?room='+state.code,{type,requestToken})}catch(e){toast(e.message)}}async function joinRoom(code){try{const s=await api('/api/join',{code});history.replaceState(null,'','?room='+code);connect(code);render(s)}catch(e){toast(e.message)}}$('create').onclick=async()=>{try{const s=await api('/api/create',{});history.replaceState(null,'','?room='+s.code);connect(s.code);render(s)}catch(e){toast(e.message)}};$('join').onclick=()=>joinRoom($('codeInput').value.trim());$('requestPlayer').onclick=async()=>{try{render(await api('/api/action?room='+state.code,{type:'requestPlayer'}))}catch(e){toast(e.message)}};$('start').onclick=async()=>{try{render(await api('/api/action?room='+state.code,{type:'start'}))}catch(e){toast(e.message)}};$('codeInput').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,5));const q=new URLSearchParams(location.search).get('room');if(q&&/^\d{5}$/.test(q)){$('codeInput').value=q;joinRoom(q)}
</script></body></html>
