<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg?v=20260809-1" type="image/svg+xml">
    <link rel="shortcut icon" href="favicon.svg?v=20260809-1" type="image/svg+xml">
    <title>Module E 2027 Vocabulary Flashcards - Part C2</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        .counter {
            font-size: 0.95rem;
            color: var(--text-muted);
            background: #e0e7ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 480px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 380px;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: var(--shadow);
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            user-select: none;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #ffffff;
            overflow-y: auto;
        }

        .card-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pos-badge {
            font-size: 0.75rem;
            text-transform: uppercase;
            background: #f1f5f9;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .tts-btn {
            background: #eef2ff;
            border: none;
            color: var(--primary);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .tts-btn:hover { background: #e0e7ff; }
        .tts-btn:active { transform: scale(0.95); }

        .word-main-container {
            text-align: center;
            margin: auto 0;
        }

        .word-en {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .word-grammar {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .flip-hint {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        .translations-section { margin-bottom: 15px; }

        .trans-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 1.1rem;
        }

        .lang-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .trans-he {
            font-weight: 700;
            direction: rtl;
            color: var(--primary);
        }

        .synonyms-box {
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: none;
        }

        .example-box {
            background: #fdf2f8;
            border-left: 4px solid #db2777;
            padding: 10px 14px;
            border-radius: 0 10px 10px 0;
            font-size: 0.9rem;
        }

        .example-en {
            font-weight: 600;
            margin-bottom: 4px;
            color: #831843;
        }

        .example-trans {
            font-size: 0.85rem;
            color: #9d174d;
        }

        .example-trans.he { direction: rtl; }

        .nav-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
        }

        .nav-btn {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .nav-btn:active { transform: scale(0.97); }
        .nav-btn svg { width: 18px; height: 18px; }
        
        .jump-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .jump-container a {
            text-decoration: none;
            font-size: 0.85rem;
            padding: 8px 16px;
        }
    </style>

:"הוא במיטבו היום.","official_entry":"at his/its, etc. best","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"doing as well as he can","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"bottom","pos":"Noun","grammar":"noun.","mean_he":"תחתית","ex_en":"The keys were at the bottom of the bag.","ex_he":"המפתחות היו בתחתית התיק.","official_entry":"bottom","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"the lowest part","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"shame","pos":"Noun","grammar":"noun.","mean_he":"בושה / חבל","ex_en":"What a shame you can't come.","ex_he":"איזה חבל שאתה לא יכול לבוא.","official_entry":"shame","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"a bad feeling because something is wrong; something that makes you sad","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"disturb","pos":"Verb","grammar":"verb.","mean_he":"להפריע","ex_en":"Please do not disturb.","ex_he":"נא לא להפריע.","official_entry":"disturb","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"stop someone from working or resting; make someone worried","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"transfer","pos":"Noun","grammar":"noun.","mean_he":"העברה","ex_en":"The bank transfer arrived today.","ex_he":"ההעברה הבנקאית הגיעה היום.","official_entry":"transfer","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"the act of moving something from one place or person to another","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"any minute","pos":"Phrase","grammar":"phrase.","mean_he":"בכל רגע","ex_en":"He will arrive any minute.","ex_he":"הוא יגיע בכל רגע.","official_entry":"(at) any minute; any minute now","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 synonym(s)","support_text":"very soon","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"mayor","pos":"Noun","grammar":"noun.","mean_he":"ראש עיר","ex_en":"The mayor of the city spoke.","ex_he":"ראש העיר נשא דברים.","official_entry":"mayor","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"the leader of a city government","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"underline","pos":"Verb","grammar":"verb.","mean_he":"להדגיש / קו תחתון","ex_en":"Please underline the word.","ex_he":"אנא מתח קו תחתון תחת המילה.","official_entry":"underline","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"draw a line under words; show that something is important","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"strengthen","pos":"Verb","grammar":"verb.","mean_he":"לחזק","ex_en":"Exercise will strengthen your muscles.","ex_he":"פעילות גופנית תחזק את שריריך.","official_entry":"strengthen","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 synonym(s)","support_text":"make stronger","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"free","pos":"Adjective","grammar":"adjective.","mean_he":"חופשי / חינם","ex_en":"Entrance to the park is free.","ex_he":"הכניסה לפארק היא בחינם.","official_entry":"free","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"costing no money; able to do what you want","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"pace","pos":"Noun","grammar":"noun.","mean_he":"קצב","ex_en":"We walked at a fast pace.","ex_he":"הלכנו בקצב מהיר.","official_entry":"pace","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"the speed of movement or work","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"organic","pos":"Adjective","grammar":"adjective.","mean_he":"אורגני","ex_en":"They only buy organic food.","ex_he":"הם קונים רק אוכל אורגני.","official_entry":"organic","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"grown or made in a natural way without man-made products","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"use","pos":"Noun","grammar":"noun.","mean_he":"שימוש / תועלת","ex_en":"What is the use of this tool?","ex_he":"מה השימוש בכלי הזה?","official_entry":"use","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"the purpose of something; help or a good result","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"dedicate","pos":"Verb","grammar":"verb.","mean_he":"להקדיש","ex_en":"Dedicate more time to study.","ex_he":"הקדש יותר זמן ללימודים.","official_entry":"dedicate","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"give time or work to a person or special reason","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"tough","pos":"Adjective","grammar":"adjective.","mean_he":"קשוח / קשה","ex_en":"It was a tough game.","ex_he":"זה היה משחק קשה.","official_entry":"tough","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"strong; difficult","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"lose interest","pos":"Phrase","grammar":"phrase.","mean_he":"לאבד עניין","ex_en":"I easily lose interest in sports.","ex_he":"אני מאבד עניין בספורט בקלות.","official_entry":"lose interest / patience, etc","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"stop wanting to know about or do something","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"former","pos":"Adjective","grammar":"adjective.","mean_he":"קודם / לשעבר","ex_en":"The former president.","ex_he":"הנשיא לשעבר.","official_entry":"former","family_members":[{"word":"FORMERLY","pos":"Adverb"}],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"from an earlier time; no longer in a position","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"the following day","pos":"Phrase","grammar":"phrase.","mean_he":"למחרת","ex_en":"We left the following day.","ex_he":"עזבנו למחרת.","official_entry":"the following day / morning, etc.","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 synonym(s)","support_text":"the next day","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"},{"en":"here you are","pos":"Phrase","grammar":"phrase.","mean_he":"בבקשה / הנה","ex_en":"Here you are, your coffee.","ex_he":"בבקשה, הקפה שלך.","official_entry":"here you are/here it is, etc.","family_members":[],"mean_fr":"-","ex_fr":"-","synonyms":[],"support_type":"A2 definition","support_text":"words said when giving something to someone","boundary_examples":"","rec_prod":"","source_url":"https://meyda.education.gov.il/files/Mazkirut_Pedagogit/English/4Lists/LISTC12.12.21.xlsx"}];
    </script>
</head>
<body>
    <header>
        <div class="title">Flashcards - Part C2</div>
        <div class="counter" id="counter">1 / 1</div>
    </header>

    <div class="container" id="cardContainer">
        <div class="card" id="flashcard" onclick="toggleCard()">
            <div class="card-face">
                <div class="card-header-top">
                    <span class="pos-badge" id="posBadge">NOUN</span>
                    <button class="tts-btn" id="ttsBtn" onclick="playAudio(event)" title="Listen">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </button>
                </div>
                <div class="word-main-container">
                    <div class="word-en" id="wordEn">Loading...</div>
                    <div class="word-grammar" id="wordGrammar"></div>
                </div>
                <div class="flip-hint">Tap card to flip ↺</div>
            </div>

            <div class="card-face card-back">
                <div class="translations-section">
                    <div class="trans-row">
                        <span class="lang-label">Hebrew</span>
                        <span class="trans-he" id="transHe">-</span>
                    </div>
                </div>
                <div class="synonyms-box" id="synonymsBox">
                    <strong>Synonyms:</strong> <span id="wordSynonyms">-</span>
                </div>
                <div class="back-details-grid" id="backDetailsGrid">
                    <div class="example-box">
                        <div class="example-en" id="exEn">-</div>
                        <div class="example-trans he" id="exHe">-</div>
                    </div>
                    <div class="family-box" id="familyBox">
                        <div class="family-title">Family Members</div>
                        <ul class="family-list" id="familyList"></ul>
                    </div>
                </div>
                <div class="flip-hint" style="margin-top: 10px;">Tap to flip back</div>
            </div>
        </div>
    </div>

    <div class="nav-container">
        <button class="nav-btn" onclick="prevCard()">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Previous
        </button>
        <button class="nav-btn" onclick="nextCard()">
            Next
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
    </div>

    <div class="jump-container">
        <a href="C1.html" class="nav-btn">Go to Previous Part</a>
        <a href="C3.html" class="nav-btn">Go to Next Part</a>
    </div>

    <script>
        let currentIndex = 0;
        let hasUserInteracted = false;

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateCard() {
            if (typeof words === 'undefined' || words.length === 0) return;
            const item = words[currentIndex];
            
            document.getElementById('flashcard').classList.remove('is-flipped');
            document.getElementById('posBadge').innerText = item.pos || '';
            document.getElementById('wordEn').innerText = item.en || '';
            document.getElementById('wordGrammar').innerText = item.grammar || '';
            document.getElementById('transHe').innerText = item.mean_he || '';
            
            if (item.synonyms && item.synonyms.length > 0) {
                document.getElementById('synonymsBox').style.display = 'block';
                document.getElementById('wordSynonyms').innerText = item.synonyms.join(', ');
            } else {
                document.getElementById('synonymsBox').style.display = 'none';
            }

            document.getElementById('exEn').innerText = item.ex_en || '';
            const exHe = document.getElementById('exHe');
            exHe.innerText = item.ex_he || '';
            exHe.style.display = item.ex_he ? 'block' : 'none';

            const familyBox = document.getElementById('familyBox');
            const familyList = document.getElementById('familyList');
            const backDetailsGrid = document.getElementById('backDetailsGrid');
            familyList.replaceChildren();
            if (item.family_members && item.family_members.length > 0) {
                familyBox.style.display = 'block';
                backDetailsGrid.classList.remove('family-empty');
                item.family_members.forEach(member => {
                    const listItem = document.createElement('li');
                    const word = document.createElement('span');
                    const pos = document.createElement('span');
                    word.className = 'family-word';
                    pos.className = 'family-pos';
                    word.textContent = member.word;
                    pos.textContent = ` — ${member.pos}`;
                    listItem.append(word, pos);
                    familyList.appendChild(listItem);
                });
            } else {
                familyBox.style.display = 'none';
                backDetailsGrid.classList.add('family-empty');
            }
            document.getElementById('counter').innerText = `${currentIndex + 1} / ${words.length}`;
            
            if (hasUserInteracted) {
                speakText(item.en);
            }
        }

        function toggleCard() {
            hasUserInteracted = true;
            const card = document.getElementById('flashcard');
            card.classList.toggle('is-flipped');
            if (card.classList.contains('is-flipped')) {
                speakText(words[currentIndex].ex_en);
            }
        }

        function nextCard() {
            hasUserInteracted = true;
            currentIndex = (currentIndex + 1) % words.length;
            updateCard();
        }

        function prevCard() {
            hasUserInteracted = true;
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            updateCard();
        }

        function playAudio(event) {
            hasUserInteracted = true;
            if (event) event.stopPropagation();
            speakText(words[currentIndex].en);
        }

        let touchStartX = 0;
        let touchEndX = 0;
        const cardElement = document.getElementById('flashcard');

        cardElement.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        cardElement.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) nextCard();
            if (touchEndX > touchStartX + threshold) prevCard();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ' || e.key === 'Enter') toggleCard();
        });

        document.body.addEventListener('click', () => {
            if (!hasUserInteracted) {
                hasUserInteracted = true;
                speakText(words[currentIndex].en);
            }
        }, { once: true });

        window.onload = updateCard;
    </script>
</body>
</html>
